name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable MSVC for the native EnvTrace backend
        if: runner.os == 'Windows' && hashFiles('src/envtrace_contract/native/**') != ''
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install
        run: python -m pip install .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
